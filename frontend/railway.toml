[build]
buildCommand = "NEXT_TELEMETRY_DISABLED=1 npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public"

[deploy]
startCommand = "HOSTNAME=0.0.0.0 NEXT_TELEMETRY_DISABLED=1 NODE_ENV=production node --max-old-space-size=256 .next/standalone/server.js"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
watchPatterns = ["frontend/**"]