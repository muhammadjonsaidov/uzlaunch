[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "java -Xmx300m -Xms128m -XX:+UseContainerSupport -jar app.jar"
healthcheckPath = "/login"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
watchPatterns = ["src/**", "pom.xml", "Dockerfile", "docker-compose.yml"]