# Append inside `http { ... }` block of /opt/nginx/nginx.conf on server.

# HTTP → HTTPS redirect (uzlaunch)
server {
    listen 80;
    server_name www.uzlaunch.uz api.uzlaunch.uz;
    return 301 https://$host$request_uri;
}

# Frontend
server {
    listen 443 ssl;
    server_name www.uzlaunch.uz;

    ssl_certificate /etc/letsencrypt/live/api.uzlaunch.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.uzlaunch.uz/privkey.pem;

    location / {
        proxy_pass http://172.17.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Backend API
server {
    listen 443 ssl;
    server_name api.uzlaunch.uz;

    ssl_certificate /etc/letsencrypt/live/api.uzlaunch.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.uzlaunch.uz/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://172.17.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}