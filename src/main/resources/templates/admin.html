<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin — UZLaunch</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <script>tailwind={config:{theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

<nav class="app-nav">
  <a href="/" class="logo-text">UZLaunch</a>
  <div class="flex items-center gap-3">
    <span class="text-xs font-bold bg-red-100 text-red-700 px-3 py-1 rounded-full">Admin</span>
    <a href="/admin/logout" class="text-sm text-slate-400 hover:text-slate-600 transition-colors">Logout</a>
  </div>
</nav>

<main class="flex-1 max-w-5xl mx-auto w-full px-5 py-8">

  <div th:if="${success}" class="alert-success mb-6" th:text="${success}"></div>
  <div th:if="${error}" class="alert-error mb-6" th:text="${error}"></div>

  <h1 class="text-2xl font-black text-slate-900 tracking-tight mb-6">Admin panel</h1>

  <!-- Stats -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
    <div class="bg-white rounded-2xl border border-slate-200 p-5 text-center">
      <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Users</p>
      <p class="text-3xl font-black text-indigo-600" th:text="${userCount}">0</p>
    </div>
    <div class="bg-white rounded-2xl border border-slate-200 p-5 text-center">
      <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Projects</p>
      <p class="text-3xl font-black text-indigo-600" th:text="${projectCount}">0</p>
    </div>
    <div class="bg-white rounded-2xl border border-slate-200 p-5 text-center">
      <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Subscribers</p>
      <p class="text-3xl font-black text-indigo-600" th:text="${subscriberCount}">0</p>
    </div>
    <div class="bg-white rounded-2xl border border-slate-200 p-5 text-center">
      <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Today signups</p>
      <p class="text-3xl font-black text-emerald-600" th:text="${todaySignups}">0</p>
    </div>
  </div>

  <!-- Users table -->
  <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden mb-8">
    <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
      <h2 class="text-sm font-bold text-slate-700">Users</h2>
      <span class="text-xs text-slate-400" th:text="${userCount} + ' total'"></span>
    </div>
    <div th:if="${users.empty}" class="py-10 text-center text-sm text-slate-400">No users yet</div>
    <div th:each="u : ${users}"
         class="flex items-center justify-between px-5 py-3.5 border-b border-slate-50 hover:bg-slate-50/50 last:border-0">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-xs font-bold text-indigo-600 flex-shrink-0"
             th:text="${not #strings.isEmpty(u.name) ? u.name.substring(0,1).toUpperCase() : 'U'}">U</div>
        <div class="min-w-0">
          <div class="text-sm font-semibold text-slate-800 truncate" th:text="${u.name}"></div>
          <div class="text-xs text-slate-400 truncate" th:text="${u.email}"></div>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-shrink-0 ml-4">
        <span th:if="${u.plan.name() == 'PAID'}" class="badge-pro">Pro</span>
        <span th:if="${u.plan.name() == 'FREE'}" class="badge-free">Free</span>
        <form th:if="${u.plan.name() == 'FREE'}"
              th:action="@{'/admin/users/' + ${u.id} + '/upgrade'}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit"
                  class="text-xs font-bold text-white bg-indigo-600 px-2.5 py-1.5 rounded-lg hover:bg-indigo-700 transition-colors">
            → Pro
          </button>
        </form>
        <form th:if="${u.plan.name() == 'PAID'}"
              th:action="@{'/admin/users/' + ${u.id} + '/downgrade'}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit"
                  class="text-xs font-bold text-slate-600 bg-slate-100 px-2.5 py-1.5 rounded-lg hover:bg-slate-200 transition-colors">
            → Free
          </button>
        </form>
        <form th:action="@{'/admin/users/' + ${u.id} + '/delete'}" method="post"
              onsubmit="return confirm('Delete user ' + this.dataset.email + ' and all their projects?')"
              th:data-email="${u.email}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit"
                  class="text-xs font-bold text-red-600 bg-red-50 px-2.5 py-1.5 rounded-lg hover:bg-red-100 transition-colors">
            Delete
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Projects table -->
  <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
    <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
      <h2 class="text-sm font-bold text-slate-700">Projects</h2>
      <span class="text-xs text-slate-400" th:text="${projectCount} + ' total'"></span>
    </div>
    <div th:if="${projects.empty}" class="py-10 text-center text-sm text-slate-400">No projects yet</div>
    <div th:each="p : ${projects}"
         class="flex items-center justify-between px-5 py-3.5 border-b border-slate-50 hover:bg-slate-50/50 last:border-0">
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2">
          <a th:href="@{'/p/' + ${p.slug}}" target="_blank"
             class="text-sm font-semibold text-indigo-600 hover:underline truncate" th:text="${p.name}"></a>
          <span class="text-xs text-slate-400 flex-shrink-0" th:text="'/' + ${p.slug}"></span>
        </div>
        <div class="text-xs text-slate-400 mt-0.5">
          <span th:text="${p.user.email}"></span>
          <span class="mx-1">·</span>
          <span th:text="${p.subscriberCount} + ' subscribers'"></span>
          <span th:if="${p.launchDate != null}" class="mx-1">·</span>
          <span th:if="${p.launchDate != null}" th:text="'Launch: ' + ${p.launchDate}"></span>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-shrink-0 ml-4">
        <form th:action="@{'/admin/projects/' + ${p.id} + '/delete'}" method="post"
              onsubmit="return confirm('Delete project ' + this.dataset.name + '?')"
              th:data-name="${p.name}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit"
                  class="text-xs font-bold text-red-600 bg-red-50 px-2.5 py-1.5 rounded-lg hover:bg-red-100 transition-colors">
            Delete
          </button>
        </form>
      </div>
    </div>
  </div>

</main>

<footer class="border-t border-slate-100 py-5 text-center">
  <p class="text-xs text-slate-300">© 2026 UZLaunch · Admin</p>
</footer>

</body>
</html>
