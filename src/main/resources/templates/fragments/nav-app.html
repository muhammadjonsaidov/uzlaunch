<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="nav(user)" class="app-nav">
  <a href="/" class="logo-text">UZLaunch</a>
  <div class="flex items-center gap-3">
    <span class="text-sm text-slate-500 font-medium" th:text="${user.name}"></span>
    <span th:if="${user.plan.name() == 'PAID'}" class="badge-pro">Pro</span>
    <span th:if="${user.plan.name() == 'FREE'}" class="badge-free">Free</span>
    <a href="/logout" class="text-sm text-slate-400 hover:text-slate-600 transition-colors">Logout</a>
  </div>
</nav>
</body>
</html>
