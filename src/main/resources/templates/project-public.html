<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title th:text="${project.name} + ' — Coming Soon'">Coming Soon</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}

.page{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;max-width:540px;margin:0 auto;width:100%;text-align:center}

.avatar{width:72px;height:72px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;margin:0 auto 28px;letter-spacing:-1px}

.project-name{font-size:clamp(28px,6vw,40px);font-weight:800;color:#0f172a;margin-bottom:10px;letter-spacing:-0.5px}
.project-tagline{font-size:17px;color:#64748b;margin-bottom:20px;line-height:1.5}
.project-description{font-size:14px;color:#94a3b8;line-height:1.7;margin-bottom:28px;max-width:420px}

/* Countdown */
.countdown-wrap{margin-bottom:28px}
.countdown-label{font-size:12px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px}
.countdown{display:flex;align-items:center;justify-content:center;gap:8px}
.cd-unit{display:flex;flex-direction:column;align-items:center;min-width:64px}
.cd-num{font-size:36px;font-weight:800;color:#0f172a;line-height:1;font-variant-numeric:tabular-nums}
.cd-label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;margin-top:4px}
.cd-sep{font-size:28px;font-weight:800;color:#e2e8f0;line-height:1;margin-bottom:14px}

/* Success message */
.success-msg{background:linear-gradient(135deg,#d1fae5,#a7f3d0);border:1px solid #6ee7b7;color:#065f46;font-size:15px;font-weight:600;padding:18px 24px;border-radius:16px;margin-bottom:24px;line-height:1.5}
.success-icon{font-size:24px;margin-bottom:8px;display:block}

/* Form */
.form-label{font-size:14px;font-weight:600;color:#374151;margin-bottom:14px}
.form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:400px;margin:0 auto}
input{border:1px solid #e2e8f0;border-radius:10px;padding:13px 16px;font-size:14px;outline:none;font-family:inherit;transition:border-color 0.15s,box-shadow 0.15s;color:#1e293b;background:#fff;text-align:left}
input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,0.12)}
input::placeholder{color:#94a3b8}
.btn-subscribe{background:#6366f1;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s;box-shadow:0 4px 16px rgba(99,102,241,0.3)}
.btn-subscribe:hover{background:#4f46e5;transform:translateY(-1px);box-shadow:0 8px 24px rgba(99,102,241,0.4)}

/* Sub count */
.sub-count{margin-top:24px;display:flex;align-items:center;justify-content:center;gap:6px}
.sub-count-pill{background:#f1f5f9;border-radius:999px;padding:6px 16px;display:flex;align-items:center;gap:6px}
.sub-count-num{font-size:15px;font-weight:800;color:#0f172a}
.sub-count-text{font-size:13px;color:#64748b}

/* Footer / badge */
.page-footer{margin-top:auto;padding:24px 20px;text-align:center;border-top:1px solid #e2e8f0;width:100%}
.powered-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8;padding:6px 16px;border:1px solid #e2e8f0;border-radius:999px;transition:all 0.15s}
.powered-badge:hover{border-color:#c7d2fe;color:#6366f1;background:#fafbff}
.powered-badge strong{color:#6366f1}
</style>
</head>
<body>

<div class="page">
  <div class="avatar" th:text="${not #strings.isEmpty(project.name) ? project.name.substring(0,1).toUpperCase() : '?'}">A</div>

  <h1 class="project-name" th:text="${project.name}">Project Name</h1>
  <p class="project-tagline" th:text="${project.tagline}">Tagline</p>
  <p class="project-description"
     th:if="${project.description != null and !project.description.empty}"
     th:text="${project.description}"></p>

  <!-- Countdown Timer -->
  <div th:if="${project.launchDate != null}" class="countdown-wrap"
       id="countdown-container" th:attr="data-launch=${project.launchDate}">
    <div class="countdown-label">Launching in</div>
    <div class="countdown">
      <div class="cd-unit">
        <span class="cd-num" id="cd-days">00</span>
        <span class="cd-label">Days</span>
      </div>
      <span class="cd-sep">:</span>
      <div class="cd-unit">
        <span class="cd-num" id="cd-hours">00</span>
        <span class="cd-label">Hours</span>
      </div>
      <span class="cd-sep">:</span>
      <div class="cd-unit">
        <span class="cd-num" id="cd-mins">00</span>
        <span class="cd-label">Mins</span>
      </div>
      <span class="cd-sep">:</span>
      <div class="cd-unit">
        <span class="cd-num" id="cd-secs">00</span>
        <span class="cd-label">Secs</span>
      </div>
    </div>
  </div>

  <!-- Success state -->
  <div th:if="${message}" class="success-msg">
    <span class="success-icon">🎉</span>
    <span th:text="${message}"></span>
  </div>

  <!-- Subscription form -->
  <div th:unless="${message}" style="width:100%;max-width:420px">
    <p class="form-label">Join the waitlist — be first to know at launch</p>
    <form class="form" method="post" th:action="'/p/' + ${project.slug} + '/subscribe'">
      <input type="text" name="name" placeholder="Your name (optional)" autocomplete="name"/>
      <input type="email" name="email" placeholder="Your email address" required autocomplete="email"/>
      <button type="submit" class="btn-subscribe">Notify me at launch →</button>
    </form>
  </div>

  <!-- Subscriber count with animation -->
  <div class="sub-count">
    <div class="sub-count-pill">
      <span class="sub-count-num" id="sub-count"
            th:attr="data-count=${project.subscriberCount}"
            th:text="${project.subscriberCount}">0</span>
      <span class="sub-count-text">people already waiting</span>
    </div>
  </div>
</div>

<div class="page-footer">
  <a href="https://uzlaunch.uz" target="_blank" rel="noopener noreferrer" class="powered-badge">
    ⚡ Powered by <strong>UZLaunch</strong>
  </a>
</div>

<script th:inline="javascript">
// Countdown timer
(function() {
  var container = document.getElementById('countdown-container');
  if (!container) return;
  var launchStr = container.getAttribute('data-launch');
  if (!launchStr) return;

  var launch = new Date(launchStr + 'T00:00:00');

  function pad(n) { return String(n).padStart(2, '0'); }

  function update() {
    var now = new Date();
    var diff = launch - now;
    if (diff <= 0) {
      container.style.display = 'none';
      return;
    }
    var days  = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var mins  = Math.floor((diff % 3600000)  / 60000);
    var secs  = Math.floor((diff % 60000)    / 1000);
    document.getElementById('cd-days').textContent  = pad(days);
    document.getElementById('cd-hours').textContent = pad(hours);
    document.getElementById('cd-mins').textContent  = pad(mins);
    document.getElementById('cd-secs').textContent  = pad(secs);
  }

  update();
  setInterval(update, 1000);
})();

// Subscriber count animation
(function() {
  var el = document.getElementById('sub-count');
  if (!el) return;
  var target = parseInt(el.getAttribute('data-count') || '0', 10);
  if (target === 0) return;

  var duration = Math.min(2000, Math.max(400, target * 20));
  var start = Date.now();

  function step() {
    var elapsed = Date.now() - start;
    var progress = Math.min(elapsed / duration, 1);
    var eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.round(eased * target);
    if (progress < 1) requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
})();
</script>
</body>
</html>
