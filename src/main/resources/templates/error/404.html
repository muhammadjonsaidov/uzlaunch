<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Page not found — UZLaunch</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.nav{position:fixed;top:0;left:0;right:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:0 32px;height:60px;display:flex;align-items:center}
.logo{font-size:18px;font-weight:800;color:#6366f1;text-decoration:none}
.error-code{font-size:120px;font-weight:900;color:#e2e8f0;letter-spacing:-4px;line-height:1;margin-bottom:8px}
h1{font-size:28px;font-weight:800;color:#0f172a;margin-bottom:12px;letter-spacing:-0.5px}
p{font-size:16px;color:#64748b;max-width:380px;margin-bottom:32px;line-height:1.6}
.btn{display:inline-block;background:#6366f1;color:#fff;padding:12px 28px;border-radius:10px;font-size:15px;font-weight:700;text-decoration:none;transition:background 0.15s}
.btn:hover{background:#4f46e5}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="logo">UZLaunch</a>
</nav>
<div class="error-code">404</div>
<h1>Page not found</h1>
<p>This page doesn't exist or the waitlist link might be incorrect. Double-check the URL and try again.</p>
