<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <script>if(localStorage.theme==='dark')document.documentElement.classList.add('dark');</script>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${project.name} + ' — Stats'">Stats</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <script>tailwind={config:{theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

<nav class="app-nav">
  <a href="/" class="logo-text" style="display:inline-flex;align-items:center;gap:7px"><img src="/favicon-32.png" width="22" height="22" style="border-radius:6px;flex-shrink:0" alt=""/>UZLaunch</a>
  <div class="flex items-center gap-4">
    <a th:href="'/projects/' + ${project.id}" class="text-sm text-slate-500 hover:text-slate-700 font-medium transition-colors">← Subscribers</a>
    <button onclick="toggleDark()" title="Toggle dark/light mode"
        class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 transition-colors">
  <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
    <a th:href="'/p/' + ${project.slug}" target="_blank" class="text-sm text-indigo-500 hover:text-indigo-600 font-semibold transition-colors">View page →</a>
  </div>
</nav>

<main class="flex-1 max-w-3xl mx-auto w-full px-5 py-8">

  <div class="mb-6">
    <h1 class="text-2xl font-black text-slate-900 tracking-tight" th:text="${project.name}"></h1>
    <p class="text-sm text-slate-400 mt-0.5">Subscriber analytics</p>
  </div>

  <!-- Stats cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
    <div class="bg-white rounded-2xl border border-slate-200 p-6">
      <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Total subscribers</p>
      <p class="text-4xl font-black text-indigo-600" th:text="${totalSubscribers}">0</p>
    </div>
    <div class="bg-white rounded-2xl border border-slate-200 p-6">
      <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Last <span th:text="${statsDays}">7</span> days</p>
      <p class="text-4xl font-black text-emerald-600" th:text="${last7Days}">0</p>
    </div>
  </div>

  <!-- Chart -->
  <div class="bg-white rounded-2xl border border-slate-200 p-6">
    <p class="text-sm font-bold text-slate-700 mb-6">Daily signups — last <span th:text="${statsDays}">7</span> days</p>
    <div class="flex items-end justify-between gap-2" style="height:180px">
      <div th:each="bar : ${chartData}"
           class="flex flex-col items-center gap-2 flex-1">
        <span class="text-xs font-bold text-slate-500" th:text="${bar.count}"></span>
        <div class="w-full rounded-t-lg transition-all"
             th:style="'height:' + ${bar.height} + 'px; background: linear-gradient(180deg, #6366f1, #8b5cf6); min-height: 4px;'"></div>
        <span class="text-xs text-slate-400 whitespace-nowrap" th:text="${bar.label}"></span>
      </div>
    </div>
    <div th:if="${totalSubscribers == 0}" class="absolute inset-0 flex items-center justify-center">
      <p class="text-sm text-slate-400">No data yet</p>
    </div>
  </div>

</main>

<footer class="border-t border-slate-100 py-5 text-center">
  <p class="text-xs text-slate-300">© 2026 UZLaunch</p>
</footer>

<script>function toggleDark(){var h=document.documentElement;var d=h.classList.toggle('dark');localStorage.theme=d?'dark':'light';}</script>
</body>
</html>
