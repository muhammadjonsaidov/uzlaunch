<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin — UZLaunch</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <script>tailwind={config:{theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-dark-gradient min-h-screen flex flex-col items-center justify-center px-4 relative overflow-hidden">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <a href="/" class="logo-text text-2xl mb-8 relative z-10">UZLaunch</a>

  <div class="glass-card w-full max-w-sm p-8 relative z-10">
    <h1 class="text-xl font-black text-white mb-1 tracking-tight">Admin access</h1>
    <p class="text-white/50 text-sm mb-7">Enter the admin secret to continue</p>

    <div th:if="${error}" class="alert-error mb-5 text-sm" th:text="${error}"></div>

    <form method="post" th:action="@{/admin/login}" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-white/60 uppercase tracking-wider mb-1.5">Admin secret</label>
        <input type="password" name="secret" class="glass-input" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn-primary w-full text-center mt-1">Access admin panel</button>
    </form>
  </div>
</body>
</html>
