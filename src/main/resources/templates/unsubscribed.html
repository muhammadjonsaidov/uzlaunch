<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Unsubscribed — UZLaunch</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <script>tailwind={config:{theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-dark-gradient min-h-screen flex flex-col items-center justify-center px-4 relative overflow-hidden">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="glass-card w-full max-w-sm p-10 text-center relative z-10">
    <div class="text-5xl mb-5">👋</div>
    <h1 class="text-xl font-black text-white mb-2">You've been unsubscribed</h1>
    <p class="text-sm text-white/50 mb-2">
      You've been removed from the
      <span class="text-white/80 font-semibold" th:text="${projectName}">project</span>
      waitlist.
    </p>
    <p class="text-sm text-white/40 mb-8">Sorry to see you go. You won't receive any more emails.</p>
    <a href="/" class="btn-glass text-sm">← Back to UZLaunch</a>
  </div>
</body>
</html>
