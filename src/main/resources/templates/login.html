<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Log in — UZLaunch</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <script>tailwind={config:{theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-dark-gradient min-h-screen flex flex-col items-center justify-center px-4 relative overflow-hidden">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <a href="/" class="logo-text text-2xl mb-8 relative z-10">UZLaunch</a>

  <div class="glass-card w-full max-w-md p-8 relative z-10">
    <h1 class="text-2xl font-black text-white mb-1 tracking-tight">Welcome back</h1>
    <p class="text-white/50 text-sm mb-7">Log in to your account</p>

    <div th:if="${error}" class="alert-error mb-5 text-sm" th:text="${error}"></div>

    <form method="post" th:action="@{/login}" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-white/60 uppercase tracking-wider mb-1.5">Email</label>
        <input type="email" name="email" class="glass-input" placeholder="you@example.com" required autocomplete="email"/>
      </div>
      <div>
        <label class="block text-xs font-semibold text-white/60 uppercase tracking-wider mb-1.5">Password</label>
        <input type="password" name="password" class="glass-input" placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn-primary w-full text-center mt-2">Log in</button>
    </form>

    <p class="text-center text-sm text-white/40 mt-6">
      Don't have an account?
      <a href="/register" class="text-indigo-400 hover:text-indigo-300 font-semibold transition-colors">Sign up free</a>
    </p>
  </div>
</body>
</html>
