<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Register — UZLaunch</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:#f8fafc;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}

.nav{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 24px;height:56px;display:flex;align-items:center}
.logo{font-size:18px;font-weight:800;color:#6366f1}

.main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:40px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,0.04)}

.card-logo{font-size:16px;font-weight:800;color:#6366f1;margin-bottom:28px;display:block}
.card h1{font-size:22px;font-weight:800;color:#0f172a;margin-bottom:4px;letter-spacing:-0.3px}
.card-sub{font-size:13px;color:#64748b;margin-bottom:28px}

.error-box{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;font-size:13px;padding:12px 16px;border-radius:10px;margin-bottom:20px}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
label{font-size:13px;font-weight:600;color:#374151}
.hint{font-size:11px;color:#94a3b8;margin-top:3px}

input{border:1px solid #e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;width:100%;outline:none;font-family:inherit;transition:border-color 0.15s,box-shadow 0.15s;color:#1e293b;background:#fff}
input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,0.12)}
input::placeholder{color:#94a3b8}

.btn-submit{background:#6366f1;color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;margin-top:4px;transition:background 0.15s}
.btn-submit:hover{background:#4f46e5}

.footer-text{font-size:13px;color:#94a3b8;text-align:center;margin-top:20px}
.footer-text a{color:#6366f1;font-weight:600}

.divider{border:none;border-top:1px solid #e2e8f0;margin:20px 0}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="logo">UZLaunch</a>
</nav>
<main class="main">
  <div class="card">
    <h1>Create your account</h1>
    <p class="card-sub">Free forever up to 100 subscribers</p>

    <div th:if="${error}" class="error-box" th:text="${error}"></div>

    <form method="post" th:action="@{/register}">
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" type="text" name="name" placeholder="Your name" required autocomplete="name"/>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" name="email" placeholder="you@example.com" required autocomplete="email"/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="Min 8 chars, 1 number" required minlength="8"/>
        <span class="hint">At least 8 characters including at least one number</span>
      </div>
      <button type="submit" class="btn-submit">Create account →</button>
    </form>

    <hr class="divider"/>
    <p class="footer-text">Already have an account? <a href="/login">Log in</a></p>
  </div>
</main>
</body>
</html>
