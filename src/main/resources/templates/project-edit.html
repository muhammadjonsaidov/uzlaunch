<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <script>if(localStorage.theme==='dark')document.documentElement.classList.add('dark');</script>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Edit project — UZLaunch</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <script>tailwind={config:{theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

<nav class="app-nav">
  <a href="/" class="logo-text">UZLaunch</a>
  <div class="flex items-center gap-3">
    <a th:href="'/projects/' + ${project.id}" class="text-sm text-slate-500 hover:text-slate-700 font-medium transition-colors">← Back</a>
    <button onclick="toggleDark()" title="Toggle dark/light mode"
        class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 transition-colors">
  <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
  </div>
</nav>

<main class="flex-1 max-w-xl mx-auto w-full px-5 py-10">

  <div th:if="${error}" class="alert-error mb-6" th:text="${error}"></div>

  <div class="mb-7">
    <h1 class="text-2xl font-black text-slate-900 tracking-tight">Edit project</h1>
    <p class="text-sm text-slate-400 mt-1" th:text="'/p/' + ${project.slug}"></p>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 p-7">
    <form th:action="'/projects/' + ${project.id} + '/edit'" method="post" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Project name *</label>
        <input type="text" name="name" class="app-input" th:value="${project.name}" required maxlength="100"/>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Tagline *</label>
        <input type="text" name="tagline" class="app-input" th:value="${project.tagline}" required maxlength="200"/>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Description <span class="text-slate-300 font-normal normal-case">(optional)</span></label>
        <textarea name="description" class="app-input" rows="3" maxlength="1000" style="resize:vertical" th:text="${project.description}"></textarea>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Launch date &amp; time <span class="text-slate-300 font-normal normal-case">(optional)</span></label>
        <input type="datetime-local" name="launchAt" class="app-input"
               th:value="${project.launchAt != null ? #temporals.format(project.launchAt, 'yyyy-MM-dd''T''HH:mm') : ''}"/>
        <p class="text-xs text-slate-400 mt-1">Subscribers notified automatically at this time. Changing resets notification.</p>
      </div>

      <!-- Launch email customization — PAID only -->
      <div class="border-t border-slate-100 pt-5" th:if="${project.user.plan.name() == 'PAID'}">
        <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Launch announcement email <span class="text-slate-300 font-normal normal-case">(optional — uses default if blank)</span></p>
        <div class="space-y-3">
          <div>
            <label class="block text-xs text-slate-500 mb-1">Email subject</label>
            <input type="text" name="launchEmailSubject" class="app-input" maxlength="200"
                   th:value="${project.launchEmailSubject}"
                   th:placeholder="'🚀 ' + ${project.name} + ' is live!'"/>
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">Message body</label>
            <textarea name="launchEmailBody" class="app-input" rows="4" maxlength="2000" style="resize:vertical"
                      placeholder="Write your launch message here. Tell subscribers what's new, what they can do, or how to get started..."
                      th:text="${project.launchEmailBody}"></textarea>
          </div>
        </div>
      </div>
      <div class="border-t border-slate-100 pt-5" th:unless="${project.user.plan.name() == 'PAID'}">
        <div class="rounded-xl p-4" style="background:#faf5ff;border:1px solid #e9d5ff">
          <p class="text-xs font-bold text-purple-600 uppercase tracking-wider mb-1">Custom launch email</p>
          <p class="text-xs text-purple-500">Customize your launch announcement email with Pro plan.</p>
          <a href="https://t.me/uzlaunch" target="_blank" class="inline-block mt-2 text-xs font-bold text-purple-600 hover:text-purple-700">Upgrade to Pro →</a>
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" class="btn-primary w-full text-center" style="padding:13px">Save changes</button>
      </div>
    </form>
  </div>

</main>

<footer class="border-t border-slate-100 py-5 text-center">
  <p class="text-xs text-slate-300">© 2026 UZLaunch</p>
</footer>

<script>function toggleDark(){var h=document.documentElement;var d=h.classList.toggle('dark');localStorage.theme=d?'dark':'light';}</script>
</body>
</html>
