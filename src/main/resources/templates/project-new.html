<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>New project — UZLaunch</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <script>tailwind={config:{theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

<nav class="app-nav">
  <a href="/" class="logo-text">UZLaunch</a>
  <a href="/dashboard" class="text-sm text-slate-500 hover:text-slate-700 font-medium transition-colors">← Dashboard</a>
</nav>

<main class="flex-1 max-w-xl mx-auto w-full px-5 py-10">

  <div th:if="${error}" class="alert-error mb-6" th:text="${error}"></div>

  <div class="mb-7">
    <h1 class="text-2xl font-black text-slate-900 tracking-tight">Create new project</h1>
    <p class="text-sm text-slate-400 mt-1">Your public waitlist page will be live instantly</p>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 p-7">
    <form method="post" th:action="@{/projects/new}" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Project name *</label>
        <input type="text" name="name" class="app-input" placeholder="e.g. My Awesome Startup" required maxlength="100"/>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Tagline *</label>
        <input type="text" name="tagline" class="app-input" placeholder="One sentence about what you're building" required maxlength="200"/>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Description <span class="text-slate-300 font-normal normal-case">(optional)</span></label>
        <textarea name="description" class="app-input" rows="3" placeholder="Tell visitors more about your project..." maxlength="1000" style="resize:vertical"></textarea>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Expected launch date <span class="text-slate-300 font-normal normal-case">(optional)</span></label>
        <input type="date" name="launchDate" class="app-input"/>
        <p class="text-xs text-slate-400 mt-1">Shows a countdown timer on your page</p>
      </div>
      <div class="pt-2">
        <button type="submit" class="btn-primary w-full text-center" style="padding:13px">Create project →</button>
      </div>
    </form>
  </div>

</main>

<footer class="border-t border-slate-100 py-5 text-center">
  <p class="text-xs text-slate-300">© 2026 UZLaunch</p>
</footer>

</body>
</html>
