spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: uzlaunch

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  thymeleaf:
    cache: false
    encoding: UTF-8

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 7d

resend:
  api-key: ${RESEND_API_KEY:}

app:
  mail:
    from: ${MAIL_FROM:UZLaunch <noreply@uzlaunch.uz>}
  base-url: ${BASE_URL:http://localhost:8080}
  trust-proxy: ${TRUST_PROXY:false}

admin:
  secret: ${ADMIN_SECRET}